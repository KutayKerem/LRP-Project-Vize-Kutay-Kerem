<!DOCTYPE html>
<html lang="tr">
<head>
    <script>
        if (localStorage.getItem("userRole") !== "Admin") {
            alert("Yetkisiz Erişim!");
            location.href = "/login.html";
        }
    </script>
    <meta charset="UTF-8">
    <title>LRP Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #212529;
            position: fixed;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .nav-link {
            color: #adb5bd;
            cursor: pointer;
            transition: 0.3s;
        }

            .nav-link:hover {
                color: white;
                background: #343a40;
                border-radius: 5px;
            }

        .active-link {
            color: white !important;
            background: #0d6efd !important;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar p-3 shadow">
        <h4 class="text-center mb-4">🖥️ LRP Admin</h4><hr>
        <ul class="nav flex-column gap-2">
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/dashboard.html', this)"><i class="fas fa-chart-pie me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/labs.html', this)"><i class="fas fa-door-open me-2"></i>Lab Yönetimi</a></li>
            <li class="nav-item mt-5"><a class="nav-link text-danger" onclick="localStorage.clear(); location.href='/login.html'"><i class="fas fa-sign-out-alt me-2"></i>Çıkış</a></li>
        </ul>
    </div>
    <div class="main-content"><div id="page-content"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadPage(url, element) {
            const res = await fetch(url);
            if (res.ok) {
                document.getElementById("page-content").innerHTML = await res.text();
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
                if (element) element.classList.add('active-link');
                const scripts = document.getElementById("page-content").querySelectorAll("script");
                scripts.forEach(s => {
                    const newS = document.createElement("script");
                    newS.text = s.text;
                    document.body.appendChild(newS).parentNode.removeChild(newS);
                });
            }
        }
        window.onload = () => loadPage('/view/dashboard.html', document.querySelector('.nav-link'));
    </script>
</body>
</html>
