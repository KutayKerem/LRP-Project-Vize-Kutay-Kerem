<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="fas fa-door-open me-2"></i>Laboratuvar Yönetimi</h3>
    <button class="btn btn-primary shadow-sm" onclick="openLabModal()">
        <i class="fas fa-plus me-1"></i> Yeni Lab Ekle
    </button>
</div>

<!-- Laboratuvar Listesi -->
<div class="card shadow-sm border-0">
    <table class="table table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Laboratuvar Adı</th>
                <th class="text-end">İşlemler</th>
            </tr>
        </thead>
        <tbody id="labTableBody"></tbody>
    </table>
</div>

<!-- LABORATUVAR EKLE/DÜZENLE MODALI -->
<div class="modal fade" id="labModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Laboratuvar Formu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="labId">
                <div class="mb-3">
                    <label class="form-label">Laboratuvar İsmi</label>
                    <input type="text" id="labName" class="form-control" placeholder="Örn: Lab-A">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" onclick="saveLab()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<!-- BİLGİSAYAR YÖNETİM VE ZİMMETLEME MODALI -->
<div class="modal fade" id="pcModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="pcModalTitle">Cihaz Yönetimi</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Yeni PC Ekleme Formu -->
                <div class="card bg-light p-3 mb-4 border-0">
                    <h6 class="mb-3">Yeni Bilgisayar Ekle</h6>
                    <div class="row g-2">
                        <div class="col-md-3"><input type="text" id="pcBrand" class="form-control" placeholder="Marka"></div>
                        <div class="col-md-3"><input type="text" id="pcProcessor" class="form-control" placeholder="İşlemci"></div>
                        <div class="col-md-2"><input type="number" id="pcRam" class="form-control" placeholder="RAM (GB)"></div>
                        <div class="col-md-4">
                            <button class="btn btn-success w-100" onclick="addPC()">
                                <i class="fas fa-plus me-1"></i> PC Ekle (Otomatik Kod Üret)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Mevcut PC Listesi -->
                <table class="table table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Demirbaş No</th>
                            <th>Özellikler</th>
                            <th>Zimmetli Öğrenci No</th>
                            <th class="text-end">Zimmet İşlemi</th>
                        </tr>
                    </thead>
                    <tbody id="pcTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let currentLabId = null;

    // --- LABORATUVAR İŞLEMLERİ ---
    async function getLabs() {
        const res = await fetch("/api/admin/labs");
        const labs = await res.json();
        document.getElementById("labTableBody").innerHTML = labs.map(l => `
            <tr>
                <td>${l.id}</td>
                <td class="fw-bold">${l.name}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-info text-white" onclick="openPCModal(${l.id}, '${l.name}')">
                        <i class="fas fa-desktop me-1"></i> Cihazlar
                    </button>
                    <button class="btn btn-sm btn-warning" onclick="editLab(${l.id}, '${l.name}')">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteLab(${l.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>`).join("");
    }

    function openLabModal() {
        document.getElementById("labId").value = "";
        document.getElementById("labName").value = "";
        new bootstrap.Modal(document.getElementById('labModal')).show();
    }

    async function saveLab() {
        const id = document.getElementById("labId").value;
        const name = document.getElementById("labName").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `/api/admin/labs/${id}` : "/api/admin/labs";

        await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name })
        });

        bootstrap.Modal.getInstance(document.getElementById('labModal')).hide();
        getLabs();
    }

    async function deleteLab(id) {
        if (confirm("Laboratuvar silinecek, emin misiniz?")) {
            await fetch("/api/admin/labs/" + id, { method: "DELETE" });
            getLabs();
        }
    }

    // --- BİLGİSAYAR VE ZİMMETLEME İŞLEMLERİ ---
    function openPCModal(id, name) {
        currentLabId = id;
        document.getElementById("pcModalTitle").innerText = name + " - Cihaz Listesi";
        refreshPCList();
        new bootstrap.Modal(document.getElementById('pcModal')).show();
    }

    async function refreshPCList() {
        const res = await fetch("/api/admin/labs");
        const labs = await res.json();
        const lab = labs.find(l => l.id === currentLabId);

        document.getElementById("pcTableBody").innerHTML = lab.computers.map(pc => `
            <tr>
                <td><span class="badge bg-secondary">${pc.assetCode}</span></td>
                <td>${pc.brand} - ${pc.processor} (${pc.ram}GB)</td>
                <td><input type="text" id="assign-no-${pc.id}" class="form-control form-control-sm"
                    value="${pc.assignedStudentUsername || ''}" placeholder="Öğrenci No"></td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary" onclick="assignPC(${pc.id})">Zimmetle</button>
                </td>
            </tr>`).join("");
    }

    async function addPC() {
        const pcData = {
            brand: document.getElementById("pcBrand").value,
            processor: document.getElementById("pcProcessor").value,
            ram: parseInt(document.getElementById("pcRam").value),
            labId: currentLabId,
            hasHdmi: true,
            hasVeyon: true
        };

        await fetch("/api/admin/labs/computers", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pcData)
        });
        refreshPCList();
    }

    async function assignPC(pcId) {
        const studentNo = document.getElementById(`assign-no-${pcId}`).value;
        if (!studentNo) return alert("Öğrenci numarası girin!");

        const res = await fetch("/api/admin/labs/assign", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ computerId: pcId, studentNo: studentNo })
        });

        if (res.ok) alert("Zimmetlendi ve öğrenci hesabı açıldı!");
    }

    getLabs();
</script>
