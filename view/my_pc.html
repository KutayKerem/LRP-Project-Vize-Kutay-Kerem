<div class="container-fluid">
    <h3><i class="fas fa-desktop me-2"></i>Zimmetli Bilgisayarım</h3>
    <hr>
    <div id="pc-content">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
</div>

<script>
    (async () => {
        const user = localStorage.getItem("username");
        const res = await fetch(`/api/admin/labs/my-pc/${user}`);

        if (res.ok) {
            const pc = await res.json();
            document.getElementById("pc-content").innerHTML = `
                <div class="card shadow-sm border-primary" style="max-width: 500px;">
                    <div class="card-body">
                        <h4 class="card-title text-primary">${pc.brand}</h4>
                        <p class="mb-1"><strong>Demirbaş:</strong> ${pc.assetCode}</p>
                        <p class="mb-1"><strong>İşlemci:</strong> ${pc.processor}</p>
                        <p class="mb-1"><strong>RAM:</strong> ${pc.ram} GB</p>
                        <div class="mt-3">
                            <span class="badge ${pc.hasHdmi ? 'bg-success' : 'bg-danger'}">HDMI</span>
                            <span class="badge ${pc.hasVeyon ? 'bg-success' : 'bg-danger'}">Veyon</span>
                        </div>
                    </div>
                </div>`;
        } else {
            document.getElementById("pc-content").innerHTML = `<div class="alert alert-info">Henüz zimmetli cihazınız yok.</div>`;
        }
    })();
</script>
